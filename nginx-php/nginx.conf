# Change YOUR_TOKEN to your prerender token
# Change example.com (server_name) to your website url
# Change /path/to/your/root to the correct value

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    fastcgi_cache_path /var/cache/nginxfastcgi levels=1:2 keys_zone=fastcgicache:10m inactive=10m max_size=64m;
    fastcgi_cache_key $scheme$request_method$host$request_uri$http_x_prerender$http_user_agent;
    fastcgi_cache_lock on;
    fastcgi_cache_use_stale error timeout invalid_header updating http_500;
    fastcgi_cache_valid 5m;

    map $http_user_agent $prerender_ua {
        default       0;
        "~*Prerender" 0;

        # Search Engines
        "~*googlebot"            1;
        "~*adsbot-google"        1;
        "~*apis-google"          1;
        "~*mediapartners-google" 1;
        "~*google-safety"        1;
        "~*feedfetcher-google"   1;
        "~*googleproducer"       1;
        "~*google-site-verification" 1;
        "~*bingbot"              1;
        "~*yandexbot"            1;
        "~*yabrowser"            1;
        "~*yahoo"                1;
        "~*baiduspider"          1;
        "~*naver"                1;
        "~*seznambot"            1;
        "~*sznprohlizec"         1;
        "~*qwantbot"             1;
        "~*ecosia"               1;
        "~*duckduckbot"          1;
        "~*duckassistbot"        1;
        "~*applebot"             1;
    
        # Social Media
        "~*facebookexternalhit"  1;
        "~*facebookcatalog"      1;
        "~*facebookbot"          1;
        "~*meta-externalagent"   1;
        "~*instagram"            1;
        "~*twitterbot"           1;
        "~*linkedinbot"          1;
        "~*whatsapp"             1;
        "~*slackbot"             1;
        "~*pinterest"            1;
        "~*tiktok"               1;
        "~*tiktokspider"         1;
        "~*bytespider"           1;
        "~*discordbot"           1;
    
        # SEO Tools
        "~*semrushbot"           1;
        "~*ahrefsbot"            1;
        "~*chrome-lighthouse"    1;
        "~*screaming-frog"       1;
        "~*oncrawlbot"           1;
        "~*botifybot"            1;
        "~*deepcrawl"            1;
        "~*lumar"                1;
        "~*rogerbot"             1;
        "~*dotbot"               1;
    
        # AI Bots
        "~*gptbot"               1;
        "~*chatgpt"              1;
        "~*oai-searchbot"        1;
        "~*chatgpt-user"         1;
        "~*claudebot"            1;
        "~*google-extended"      1;
        "~*perplexitybot"        1;
        "~*perplexity-user"      1;
        "~*youbot"               1;
        "~*amazonbot"            1;
        "~*anthropic-ai"         1;
        "~*claude-web"           1;
        "~*ccbot"                1;
        "~*mistralai-user"       1;
    
        # Other bots
        "~*embedly"              1;
        "~*quora\ link\ preview" 1;
        "~*showyoubot"           1;
        "~*outbrain"             1;
        "~*developers.google.com/\+/web/snippet" 1;
        "~*vkshare"              1;
        "~*w3c_validator"        1;
        "~*redditbot"            1;
        "~*flipboard"            1;
        "~*tumblr"               1;
        "~*bitlybot"             1;
        "~*skypeuripreview"      1;
        "~*nuzzel"               1;
        "~*google\ page\ speed"  1;
        "~*qwantify"             1;
        "~*pinterestbot"         1;
        "~*bitrix\ link\ preview" 1;
        "~*xing-contenttabreceiver" 1;
        "~*telegrambot"          1;
        "~*google-inspectiontool" 1;
        "~*petalbot"             1;       
    }

    map $args $prerender_args {
        default $prerender_ua;
        "~(^|&)_escaped_fragment_=" 1;
    }

    map $http_x_prerender $x_prerender {
        default $prerender_args;
        "1"     0;
    }

    map $uri $prerender {
        default $x_prerender;
        "~*\.(js|css|xml|less|png|jpg|jpeg|gif|pdf|txt|ico|rss|zip|mp3|rar|exe|wmv|doc|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|ttf|woff|woff2|svg|eot)" 0;
    }

    # log_format prerender_debug '[$time_local] $remote_addr - $remote_user - $server_name user-agent: $http_user_agent prerender: $prerender: $request to: $upstream_addr upstream_response_time: $upstream_response_time msec $msec request_time $request_time';

    server {
        listen       80;
        server_name  example.com;
        root   /path/to/your/root;

        location / {
            if ($prerender = 1) {
                rewrite (.*) /prerenderio last;
            }
            rewrite (.*) /index.php$1 last;
        }

        location /prerenderio {
            if ($prerender = 0) {
                return 404;
            }

            proxy_set_header X-Prerender-Token YOUR_TOKEN;
            proxy_set_header X-Prerender-Int-Type Nginx_Php;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "private,max-age=600,must-revalidate";

            #resolve using Google's DNS server to force DNS resolution and prevent caching of IPs
            resolver 8.8.8.8 8.8.4.4;
            set $prerender_host "service.prerender.io";
            proxy_pass https://$prerender_host;
            rewrite .* /$scheme://$host$request_uri? break;
        }

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000

        location ~ [^/]\.php(/|$) {
            if ($prerender = 1) {
                rewrite (.*) /prerenderio last;
            }
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            if (!-f $document_root$fastcgi_script_name) {
                return 404;
            }

            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  HTTP_PROXY "";
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        fastcgi_params;

            fastcgi_cache fastcgicache;
        }
    }
}
